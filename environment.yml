# ATOC 4815/5815 -- shared class environment, Fall 2026
# One environment for everything we use from here through the end of the semester
# (covers what we've already installed ad hoc, plus xarray and the rest of the 2024/2026 course code).
#
# Create it:   conda env create -f environment.yml      (if you have mamba installed, it's faster: mamba env create -f environment.yml)
# Activate it: conda activate atoc4815
# Update it later in the semester (after a `git pull`):
#              conda env update -f environment.yml --prune

name: atoc4815
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - matplotlib
  - scipy
  - pandas
  - xarray
  - cartopy
  - netCDF4
  - h5py
  - pyhdf
  - scikit-learn
  - pyproj
  - eofs
  - pysolar
  - spectral
  - jupyterlab
  - notebook
  - ipython
  - spyder
  - spyder-kernels
  - pip
  - pip:
      - soundfile
